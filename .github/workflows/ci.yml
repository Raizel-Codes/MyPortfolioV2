name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      # `next build` runs its own full TypeScript check, and (unlike a standalone
      # `tsc --noEmit`) generates .next/types first — the route handlers use Next's
      # generated `RouteContext<...>` type, which doesn't exist until a build/dev run
      # has produced it, so a separate tsc step here would fail on a fresh checkout.
      - run: npm run build
